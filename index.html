<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#070c17"><link rel=manifest href=manifest.webmanifest><title>MaskedKilla's CFB Tracker</title><style>
*{box-sizing:border-box}body{margin:0;background:#070c17;color:#eee;font:14px Arial}header{padding:12px;background:#111b2b;position:sticky;top:0;z-index:9}h1{font-size:20px;margin:0 0 8px}button{padding:9px;border:0;border-radius:7px;background:#1769ff;color:#fff;margin:2px}nav{display:flex;overflow:auto;background:#0c1422;padding:6px}nav button{white-space:nowrap;background:#182337}main{padding:10px;max-width:1000px;margin:auto}.p{display:none}.on{display:block}.c{background:#101827;border:1px solid #27354c;border-radius:10px;padding:12px;margin:8px 0}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px}input,select,textarea{width:100%;padding:9px;background:#080f1c;color:#fff;border:1px solid #34445f;border-radius:6px}textarea{min-height:70px}.l{color:#9da9bc;font-size:12px}.i{background:#172235;padding:9px;border-radius:7px;margin:6px 0}.x{background:#c62828}table{width:100%}td,th{padding:5px;border-bottom:1px solid #29364c}
</style></head><body><header><h1>🏈 MaskedKilla's CFB Tracker</h1><button onclick=u()>↩</button><button onclick=b()>💾</button><button onclick=f.click()>📥</button><input id=f type=file accept=.json hidden onchange=r(event)></header><nav id=n></nav><main id=m></main><script>
const K=['seasons','teams','players','games','stats','plays','acc','awards'],key=x=>'cfb'+x[0].toUpperCase()+x.slice(1),L={pass_yds:'Pass Yds',pass_td:'Pass TD',pass_int:'INT',completions:'Comp',pass_att:'Pass Att',rush_yds:'Rush Yds',rush_td:'Rush TD',rush_att:'Rush Att',rec:'Rec',rec_yds:'Rec Yds',rec_td:'Rec TD',tackles:'Tackles',tfl:'TFL',sacks:'Sacks',def_int:'Def INT',pd:'PD',ff:'FF',fr:'FR',fgm:'FGM',fga:'FGA',xpm:'XPM',ret_yds:'Return Yds',ret_td:'Return TD',punt:'Punts',punt_yds:'Punt Yds',pancakes:'Pancakes',td:'TD'},$=x=>document.getElementById(x),v=x=>$(x)?.value||'',id=()=>Date.now()+Math.random(),E=x=>String(x??'').replace(/[&<>"']/g,z=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[z])),N=(a,i)=>a.find(x=>x.id==i)?.name||'Unknown';let S={},H=[];K.forEach(x=>S[x]=JSON.parse(localStorage[key(x)]||'[]'));S.archive=JSON.parse(localStorage.cfbArchive||'[]');

function save(){K.forEach(x=>localStorage[key(x)]=JSON.stringify(S[x]));localStorage.cfbArchive=JSON.stringify(S.archive)}function cp(){H.push(JSON.stringify(S));if(H.length>20)H.shift()}function u(){if(H.length){S=JSON.parse(H.pop());save();draw()}}function add(a,x){cp();S[a].push({id:id(),...x});save();draw()}function opt(id,a,all=0){$(id).innerHTML=(all?'<option value="">All</option>':'<option value="">Select</option>')+a.map(x=>`<option value=${x.id}>${E(x.name||x.year)}</option>`).join('')}function so(){let a=S.seasons;['ps','gs','ss','ls','as','aws','ars'].forEach(x=>opt(x,a));['rs','sf','af','awf'].forEach(x=>opt(x,a,1))}function to(){let a=S.teams;['gt','ga','pt','st','lt','at','awt'].forEach(x=>opt(x,a));['rt','tf','aft','awft'].forEach(x=>opt(x,a,1))}function po(){let a=S.players.filter(x=>(!v('ps')||x.seasonId==v('ps'))&&(!v('pt')||x.teamId==v('pt')));['pp','pp2','sp','ap','awp'].forEach(x=>opt(x,a))}function go(){opt('pg',S.games.map(x=>({...x,name=`${N(S.teams,x.awayId)} at ${N(S.teams,x.homeId)} ${x.date||''}`})))}function page(x){document.querySelectorAll('.p').forEach(z=>z.classList.remove('on'));$(x).classList.add('on')}

const nav=['home','seasons','teams','roster','games','plays','stats','lineup','accomplishments','awards','archive'];n.innerHTML=nav.map(x=>`<button onclick="page('${x}')">${x}</button>`).join('');
m.innerHTML=`
<section id=home class="p on"><h2>Dashboard</h2><div class=g id=d></div></section>
<section id=seasons class=p><h2>Seasons</h2><div class=c><form onsubmit="season(event)"><div class=g><input id=sy placeholder=Year required><input id=sn placeholder="Season name"></div><button>Add</button></form></div><div id=sl></div></section>
<section id=teams class=p><h2>Teams</h2><div class=c><form onsubmit="team(event)"><div class=g><input id=tn placeholder=Team required><input id=ts placeholder=Short><input id=tc placeholder=Conference><input id=tl placeholder=Level value=FBS><input id=ty placeholder=Color><input id=tv placeholder=Stadium><input id=tlogo placeholder="Logo URL"></div><button>Add</button></form></div><div id=tlst></div></section>
<section id=roster class=p><h2>Roster</h2><div class=c><form onsubmit="player(event)"><div class=g><select id=ps onchange=po()></select><select id=pt></select><input id=pn placeholder=#><input id=pname placeholder=Name required><input id=pos placeholder=Position><input id=pc placeholder=Class><input id=ph placeholder=Height><input id=pw placeholder=Weight><input id=phome placeholder=Hometown><input id=prev placeholder="Previous School"><input id=photo placeholder="Photo URL"></div><button>Add</button></form></div><div class=c><select id=rs onchange=players()></select><select id=rt onchange=players()></select></div><div id=pl></div></section>
<section id=games class=p><h2>Games</h2><div class=c><form onsubmit="game(event)"><div class=g><select id=gs></select><select id=gh></select><select id=ga></select><input id=gd type=date><input id=gm placeholder=Time><input id=gw placeholder=Week><input id=gv placeholder=Venue><input id=g1 type=number value=0><input id=g2 type=number value=0><select id=gstat><option>Scheduled</option><option>Live</option><option>Final</option></select></div><button>Add</button></form></div><div id=gl></div></section>
<section id=plays class=p><h2>Play-by-Play</h2><div class=c><form onsubmit="play(event)"><div class=g><select id=pg></select><select id=pt></select><select id=pp></select><select id=pp2></select><select id=pd><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option></select><select id=px><option>Pass</option><option>Rush</option><option>Reception</option><option>Sack</option><option>Interception</option><option>Fumble</option><option>Field Goal</option><option>Extra Point</option><option>Punt</option><option>Defense</option></select><input id=py type=number placeholder=Yards><input id=pr placeholder="Result e.g. TD,made,complete"><textarea id=desc placeholder=Description></textarea></div><button>Add Play</button></form></div><div id=ply></div></section>
<section id=stats class=p><h2>Stats</h2><div class=c><select id=sf onchange=stats()></select><select id=tf onchange=stats()></select></div><div class=c><form onsubmit="stat(event)"><div class=g><select id=ss></select><select id=st></select><select id=sp></select><select id=stt></select><input id=sv type=number step=any></div><button>Add Stat</button></form></div><div id=stl></div></section>
<section id=lineup class=p><h2>Best Lineup</h2><div class=c><select id=ls onchange=lineup()></select><select id=lt onchange=lineup()></select></div><div id=ll></div></section>
<section id=accomplishments class=p><h2>Accomplishments</h2><div class=c><form onsubmit="acc(event)"><div class=g><select id=as></select><select id=at></select><select id=ap></select><input id=ax placeholder=Type><input id=atit placeholder=Title required><textarea id=ad placeholder=Description></textarea></div><button>Add</button></form></div><div class=c><select id=af onchange=accs()></select><select id=aft onchange=accs()></select></div><div id=acl></div></section>
<section id=awards class=p><h2>Player Awards</h2><div class=c><form onsubmit="award(event)"><div class=g><select id=aws></select><select id=awt></select><select id=awp></select><input id=awn placeholder=Award required><input id=awc placeholder=Category><textarea id=awd placeholder=Description></textarea></div><button>Add</button></form></div><div class=c><select id=awf onchange=awards()></select><select id=awft onchange=awards()></select></div><div id=awl></div></section>
<section id=archive class=p><h2>Archive</h2><div class=c><form onsubmit="arch(event)"><select id=ars></select><textarea id=arx placeholder="Season notes"></textarea><button>Save</button></form></div><div id=arl></div></section>`;

S.stats.forEach(x=>{});stt.innerHTML=Object.entries(L).map(x=>`<option value=${x[0]}>${x[1]}</option>`).join('');

function season(e){e.preventDefault();add('seasons',{year:v('sy'),name:v('sn')||v('sy')});e.target.reset()}function team(e){e.preventDefault();add('teams',{name:v('tn'),short:v('ts'),conference:v('tc'),level:v('tl'),color:v('ty'),stadium:v('tv'),logo:v('tlogo')});e.target.reset()}function player(e){e.preventDefault();add('players',{seasonId:v('ps'),teamId:v('pt'),number:v('pn'),name:v('pname'),position:v('pos'),class:v('pc'),height:v('ph'),weight:v('pw'),hometown:v('phome'),previous:v('prev'),photo:v('photo')});e.target.reset()}function game(e){e.preventDefault();add('games',{seasonId:v('gs'),homeId:v('gh'),awayId:v('ga'),date:v('gd'),time:v('gm'),week:v('gw'),venue:v('gv'),homeScore:+v('g1')||0,awayScore:+v('g2')||0,status:v('gstat')});e.target.reset()}

function st(p,s,t,type,n,playId){let x=S.stats.find(x=>x.playerId==p&&x.seasonId==s&&x.teamId==t&&x.type==type);x?x.value=(+x.value||0)+n:S.stats.push({id:id(),playerId:p,seasonId:s,teamId:t,type,value:n,playId})}function score(g,t,n){g.homeId==t?g.homeScore+=n:g.awayId==t&&(g.awayScore+=n)}
function play(e){e.preventDefault();cp();let g=S.games.find(x=>x.id==v('pg')),p=v('pp'),q=v('pp2'),t=v('pt'),y=+v('py')||0,r=v('pr').toLowerCase(),x=v('px'),s=g?.seasonId;if(!g)return;S.plays.push({id:id(),gameId:g.id,teamId:t,playerId:p,player2Id:q,type:x,yards:y,result:v('pr'),description:v('desc')});
if(x=='Pass'){st(p,s,t,'pass_att',1);if(/complete|td/.test(r))st(p,s,t,'completions',1);st(p,s,t,'pass_yds',y);if(/int/.test(r))st(p,s,t,'pass_int',1);if(q){st(q,s,t,'rec',1);st(q,s,t,'rec_yds',y)}if(/td/.test(r)){st(p,s,t,'pass_td',1);st(p,s,t,'td',1);q&&(st(q,s,t,'rec_td',1),st(q,s,t,'td',1));score(g,t,6)}}else if(x=='Rush'){st(p,s,t,'rush_att',1);st(p,s,t,'rush_yds',y);if(/td/.test(r)){st(p,s,t,'rush_td',1);st(p,s,t,'td',1);score(g,t,6)}}else if(x=='Reception'){st(p,s,t,'rec',1);st(p,s,t,'rec_yds',y);if(/td/.test(r)){st(p,s,t,'rec_td',1);st(p,s,t,'td',1);score(g,t,6)}}else if(x=='Sack'){st(p,s,t,'tackles',1);st(p,s,t,'tfl',1);st(p,s,t,'sacks',1)}else if(x=='Interception'){st(p,s,t,'def_int',1);q&&st(q,s,g.homeId==t?g.awayId:g.homeId,'pass_int',1)}else if(x=='Fumble'){st(p,s,t,'ff',1);q&&st(q,s,t,'fr',1)}else if(x=='Field Goal'){st(p,s,t,'fga',1);if(/made|good/.test(r)){st(p,s,t,'fgm',1);score(g,t,3)}}else if(x=='Extra Point'&&/made|good|complete/.test(r)){st(p,s,t,'xpm',1);score(g,t,1)}else if(x=='Punt'){st(p,s,t,'punt',1);st(p,s,t,'punt_yds',y)}else if(x=='Defense')st(p,s,t,'tackles',1);g.status='Live';save();draw();e.target.reset()}

function box(a,t,id,sub){return `<div class=i><b>${E(t)}</b><br><span class=l>${E(sub||'')}</span><br><button class=x onclick="del('${a}','${id}')">Delete</button></div>`}function del(a,i){cp();S[a]=S[a].filter(x=>x.id!=i);save();draw()}
function seasons(){sl.innerHTML=S.seasons.map(x=>box('seasons',x.name||x.year,x.id,x.year)).join('')}function teams(){tlst.innerHTML=S.teams.map(x=>box('teams',x.name,x.id,`${x.conference||''} ${x.level||''}`)).join('')}function players(){let s=v('rs'),t=v('rt');pl.innerHTML=S.players.filter(x=>(!s||x.seasonId==s)&&(!t||x.teamId==t)).map(x=>box('players',`#${x.number||''} ${x.name}`,x.id,`${x.position||''} • ${N(S.teams,x.teamId)}`)).join('')}function games(){gl.innerHTML=S.games.map(x=>box('games',`${N(S.teams,x.awayId)} ${x.awayScore} — ${x.homeScore} ${N(S.teams,x.homeId)}`,x.id,`${x.date||'TBD'} • ${x.status}`)).join('')}function plays(){ply.innerHTML=S.plays.slice().reverse().map(x=>box('plays',`${x.type} ${x.yards} yds`,x.id,`${N(S.teams,x.teamId)} • ${N(S.players,x.playerId)} • ${x.result}`)).join('')}function stats(){let s=v('sf'),t=v('tf');stl.innerHTML=S.stats.filter(x=>(!s||x.seasonId==s)&&(!t||x.teamId==t)).map(x=>box('stats',`${N(S.players,x.playerId)} — ${L[x.type]||x.type}`,x.id,`${x.value} • ${N(S.teams,x.teamId)}`)).join('')}function stat(e){e.preventDefault();cp();st(v('sp'),v('ss'),v('st'),v('stt'),+v('sv')||0);save();draw();e.target.reset()}
function lineup(){let a=S.players.filter(x=>(!v('ls')||x.seasonId==v('ls'))&&(!v('lt')||x.teamId==v('lt'))),g={QB:1,RB:1,WR:3,TE:1,OL:5,DL:4,LB:3,DB:4,K:1,P:1},o='';Object.entries(g).forEach(([p,n])=>a.filter(x=>(x.position||'').toUpperCase()==p).sort((a,b)=>sum(b)-sum(a)).slice(0,n).forEach(x=>o+=box('players',p+': '+x.name,x.id,sum(x)+' pts')));ll.innerHTML=o||'No players.'}function sum(p){return S.stats.filter(x=>x.playerId==p.id).reduce((a,x)=>a+(+x.value||0),0)}
function acc(e){e.preventDefault();add('acc',{seasonId:v('as'),teamId:v('at'),playerId:v('ap'),type:v('ax'),title:v('atit'),description:v('ad')});e.target.reset()}function accs(){let s=v('af'),t=v('aft');acl.innerHTML=S.acc.filter(x=>(!s||x.seasonId==s)&&(!t||x.teamId==t)).map(x=>box('acc',x.title,x.id,`${x.type||''} • ${N(S.players,x.playerId)} • ${x.description||''}`)).join('')}function award(e){e.preventDefault();add('awards',{seasonId:v('aws'),teamId:v('awt'),playerId:v('awp'),name:v('awn'),category:v('awc'),description:v('awd')});e.target.reset()}function awards(){let s=v('awf'),t=v('awft');awl.innerHTML=S.awards.filter(x=>(!s||x.seasonId==s)&&(!t||x.teamId==t)).map(x=>box('awards',x.name+' — '+N(S.players,x.playerId),x.id,x.category)).join('')}function arch(e){e.preventDefault();S.archive.push({id:id(),seasonId:v('ars'),content:v('arx'),date:new Date().toLocaleString()});save();draw();e.target.reset()}function archive(){arl.innerHTML=S.archive.map(x=>box('archive',N(S.seasons,x.seasonId),x.id,x.content)).join('')}

function b(){let z=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(z);a.download='cfb-backup.json';a.click()}function r(e){let q=new FileReader;q.onload=()=>{try{S=JSON.parse(q.result);save();draw();alert('Imported!')}catch(x){alert('Invalid backup')}};q.readAsText(e.target.files[0])}

function draw(){so();to();po();go();seasons();teams();players();games();plays();stats();lineup();accs();awards();archive();d.innerHTML=[['seasons','Seasons'],['teams','Teams'],['players','Players'],['games','Games']].map(x=>`<div class=c><b>${S[x[0]].length}</b><br>${x[1]}</div>`).join('')}draw();
</script></body></html>
